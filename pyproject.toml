[project]
name = "axial"
version = "0.3.0"
description = "Local, Git-backed BigQuery and DuckDB dashboards engine with per-query cost tracing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "google-cloud-bigquery>=3.20",
  "pyyaml>=6",
  "click>=8.1",
  "packaging>=23",
]

[project.optional-dependencies]
screenshot = ["playwright>=1.44"]
duckdb = ["duckdb>=1.1"]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[project.scripts]
axial = "axial.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "duckdb>=1.1", "psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axial"]
artifacts = ["src/axial/web_dist/**", "src/axial/template/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
