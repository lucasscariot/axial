[project]
name = "bqdash"
version = "0.1.0"
description = "Local, Git-backed BigQuery dashboards with per-query cost tracing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "google-cloud-bigquery>=3.20",
  "pyyaml>=6",
  "click>=8.1",
]

[project.optional-dependencies]
screenshot = ["playwright>=1.44"]

[project.scripts]
dash = "bqdash.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bqdash"]
artifacts = ["src/bqdash/web_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
